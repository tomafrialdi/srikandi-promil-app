<div style="font-family:-apple-system,'Segoe UI',Roboto,sans-serif;max-width:420px;margin:0 auto;padding:32px 24px;color:#2b2330">
  <h2 style="margin:0 0 8px;font-size:20px">Welcome to Srikandi Promil 🌸</h2>
  <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#6b6272">
    Enter this code in the app to verify your email address.
  </p>
  <div style="font-size:34px;font-weight:700;letter-spacing:10px;text-align:center;padding:18px 0;border-radius:14px;background:#f8eef3;color:#b83a6b">
    {{ .Token }}
  </div>
  <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#8f869a">
    The code expires in 1 hour. If you didn't create an account, you can safely ignore this email.
  </p>
</div>
